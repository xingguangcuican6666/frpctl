name: Build x86_64

# scripts/build_x86_64.py compiles nothing: it downloads the official x86_64
# manylinux wheels plus a relocatable x86_64 CPython and assembles them. The
# runner is x86_64, so unlike a cross-build host it can also execute the result.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - scripts/build_x86_64.py
      - pyproject.toml
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      python-version:
        description: CPython minor version to bundle
        default: "3.13"

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Cross-build the bundle
        run: |
          python scripts/build_x86_64.py \
            --self-extracting \
            --python-version '${{ inputs.python-version || '3.13' }}'

      - name: Locate the artifacts
        id: find
        run: |
          shopt -s failglob
          bundles=(dist/frp-manager-*-linux-x86_64)
          runs=(dist/frp-manager-*-linux-x86_64.run)
          test "${#bundles[@]}" -eq 1
          test "${#runs[@]}" -eq 1
          echo "bundle=${bundles[0]}" >> "$GITHUB_OUTPUT"
          echo "run=${runs[0]}" >> "$GITHUB_OUTPUT"

      - name: The bundled interpreter and native wheels must load
        run: |
          "${{ steps.find.outputs.bundle }}/python/bin/python3" - <<'PY'
          import platform
          import bcrypt, cryptography, nacl, paramiko, textual, typer, yaml
          assert platform.machine() == "x86_64", platform.machine()
          print("machine:", platform.machine())
          print("paramiko:", paramiko.__version__)
          print("cryptography:", cryptography.__version__)
          PY

      - name: The launchers must run
        run: |
          "${{ steps.find.outputs.bundle }}/bin/frpctl" --help > /dev/null
          "${{ steps.find.outputs.bundle }}/bin/frpdomain" --help > /dev/null
          "${{ steps.find.outputs.bundle }}/bin/frpctl" doctor \
            --inventory "$RUNNER_TEMP/inventory.yaml"
          "${{ steps.find.outputs.bundle }}/bin/frpdomain" list \
            --domains "$RUNNER_TEMP/domains.yaml"

      - name: The self-extracting archive must unpack and dispatch
        env:
          FRP_MANAGER_HOME: ${{ runner.temp }}/sfx
        run: |
          run='${{ steps.find.outputs.run }}'
          "$run" frpctl --help > /dev/null
          "$run" frpdomain --help > /dev/null
          # A second call must reuse the cache rather than unpack again.
          "$run" frpctl node list --inventory "$RUNNER_TEMP/inventory.yaml"
          test -x "$FRP_MANAGER_HOME"/*/bin/frpctl
          # Invoking it through a symlink named after a tool needs no argument.
          ln -s "$PWD/$run" "$RUNNER_TEMP/frpdomain"
          "$RUNNER_TEMP/frpdomain" list --domains "$RUNNER_TEMP/domains.yaml"
          # An unknown tool name must fail loudly instead of guessing.
          if "$run" not-a-tool --help; then echo "unknown tool accepted"; exit 1; fi

      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz ./*.run | tee SHA256SUMS

      - uses: actions/upload-artifact@v7
        with:
          name: frp-manager-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.run
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: frp-manager-linux-x86_64
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.tar.gz dist/*.run dist/SHA256SUMS
